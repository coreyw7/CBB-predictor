[project]
name = "cbb-predictor"
version = "0.1.0"
description = "Project built to use several datapoints to make a predictive model for a Men's CBB season"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[project.scripts]
cbb-predictor = "cbb_predictor:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
